<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - VetHome</title>

  <!-- Bootstrap solo para estructura -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- CSS propio -->
  <link rel="stylesheet" href="./assets/css/styles.css">
</head>

<body>

  <div class="d-flex">
    <!-- SIDEBAR -->
    <aside class="sidebar bg-dark text-white p-3">
      <h3 class="text-center mb-4">VetHome</h3>
      <ul class="nav flex-column">
        <li class="nav-item"><a class="nav-link text-white" href="index.html">Inicio</a></li>
        <li class="nav-item"><a class="nav-link text-white" href="mascotas.html">Mascotas</a></li>
        <li class="nav-item"><a class="nav-link text-white" href="consultas.html">Consultas</a></li>
        <li class="nav-item"><a class="nav-link text-white" href="resenas.html">Reseñas</a></li>
        <li class="nav-item"><a class="nav-link text-white" href="inventario.html">Inventario</a></li>
        <li class="nav-item"><a class="nav-link text-white" href="login.html">Iniciar Sesión</a></li>
      </ul>
    </aside>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="flex-grow-1 p-4">
      <header class="text-center mt-4">
        <h1>Iniciar Sesión en VetHome</h1>
      </header>
      <main class="container mt-5">
        <section class="row justify-content-center">
          <article class="col-md-4">
            <form id="loginForm" novalidate>
              <div class="mb-3">
                <label for="rut" class="form-label">RUT</label>
                <input type="text" class="form-control" id="rut" placeholder="11111111-1" maxlength="10">
                <div class="invalid-feedback">
                  Debe ingresar un RUT válido (ejemplo: 12345678-9 o 12345678-K).
                </div>
              </div>

              <div class="mb-3">
                <label for="contrasena" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="contrasena" placeholder="********">
                <div class="invalid-feedback">La contraseña no puede estar vacía.</div>
              </div>

              <button type="submit" class="btn-custom w-100">Ingresar</button>
            </form>

            <nav class="mt-3">
              <a href="registro.html" class="btn-secondary-custom w-100">Registrarse</a>
            </nav>

            <nav class="mt-2">
              <a href="index.html" class="btn-secondary-custom w-100">Volver al inicio</a>
            </nav>
          </article>
        </section>
      </main>
      <!-- aquí va el contenido específico de cada página -->
    </main>
  </div>




  <footer class="text-center mt-5">
    <p>&copy; 2025 VetHome - Todos los derechos reservados</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./assets/js/login.js"></script>
</body>

</html>
