<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - VetHome</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/styles.css">
</head>
<body>
<div class="container mt-5">
  <h2 class="text-center mb-4">Iniciar Sesión en VetHome</h2>
  <div class="row justify-content-center">
    <div class="col-md-4">
      <form id="loginForm" novalidate>
        <div class="mb-3">
          <label for="rut" class="form-label">RUT</label>
          <input type="text" class="form-control" id="rut" placeholder="11111111-1" maxlength="10">
          <div class="invalid-feedback">
            Debe ingresar un RUT válido (ejemplo: 12345678-9 o 12345678-K).
          </div>
        </div>
        <div class="mb-3">
          <label for="contrasena" class="form-label">Contraseña</label>
          <input type="password" class="form-control" id="contrasena" placeholder="********">
          <div class="invalid-feedback">
            La contraseña no puede estar vacía.
          </div>
        </div>
        <button type="submit" class="btn btn-custom w-100">Ingresar</button>
      </form>

      <div class="mt-3">
        <a href="registro.html" class="btn btn-primary w-100">Registrarse</a>
      </div>

      <div class="mt-2">
        <a href="index.html" class="btn btn-secondary w-100">Volver al inicio</a>
      </div>
    </div>
  </div>
</div>

<script>
  document.getElementById("loginForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const rutInput = document.getElementById("rut");
    const contrasenaInput = document.getElementById("contrasena");

    const rut = rutInput.value.trim();
    const contrasena = contrasenaInput.value.trim();

    let valido = true;

    // Validación RUT
    const rutRegex = /^[0-9]{7,8}-[0-9Kk]{1}$/;
    if (!rutRegex.test(rut)) {
      rutInput.classList.add("is-invalid");
      valido = false;
    } else {
      rutInput.classList.remove("is-invalid");
      rutInput.classList.add("is-valid");
    }

    // Validación contraseña
    if (contrasena === "") {
      contrasenaInput.classList.add("is-invalid");
      valido = false;
    } else {
      contrasenaInput.classList.remove("is-invalid");
      contrasenaInput.classList.add("is-valid");
    }

    if (!valido) return;

    // Buscar usuario registrado
    const usuarios = JSON.parse(localStorage.getItem("usuarios")) || [];
    const usuario = usuarios.find(u => u.rut === rut && u.contrasena === contrasena);

    if (!usuario) {
      alert("❌ Credenciales inválidas. Verifique sus datos o regístrese.");
      return;
    }

    // Guardar datos de sesión
    localStorage.setItem("isLoggedIn", "true");
    localStorage.setItem("rut", usuario.rut);
    localStorage.setItem("nombre", usuario.nombre);
    localStorage.setItem("rol", "cliente");

    alert("✅ Inicio de sesión exitoso. Bienvenido " + usuario.nombre);
    window.location.href = "index.html";
  });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
