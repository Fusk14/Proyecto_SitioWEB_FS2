<!DOCTYPE html>
<html lang="en">
<head>    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - VetHome</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Tu CSS personalizado -->
    <link rel="stylesheet" href="./assets/css/styles.css">
</head>
<body>
<div class="container mt-5">
    <h2 class="text-center mb-4">Iniciar Sesión en VetHome</h2>
    <div class="row justify-content-center">
        <div class="col-md-4">
            <form>
                <div class="mb-3">
                    <label for="rut" class="form-label">RUT</label>
                    <input type="text" class="form-control" id="rut" placeholder="11111111-1">
                </div>
                <div class="mb-3">
                    <label for="contrasena" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="contrasena" placeholder="********">
                </div>
                <button  type="submit" class="btn btn-custom w-100">Ingresar</button>
            </form>
        </div>
    </div>
</div>

<script>
    document.querySelector("form").addEventListener("submit", function(e) {
        e.preventDefault();

        // Simulación de login exitoso
        localStorage.setItem("isLoggedIn", "true");

        alert("✅ Inicio de sesión exitoso, redirigiendo...");
        window.location.href = "index.html";
    });
</script>


<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
