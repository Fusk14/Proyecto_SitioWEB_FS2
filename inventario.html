<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario - VetHome</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="./assets/css/styles.css">
</head>

<body>
    <div class="d-flex">
        <aside class="sidebar bg-dark text-white p-3">
            <h3 class="text-center mb-4">VetHome</h3>
            <ul class="nav flex-column">
                <li class="nav-item"><a class="nav-link text-white" href="index.html">Inicio</a></li>
                <li class="nav-item"><a class="nav-link text-white" href="mascotas.html">Mascotas</a>
                </li>
                <li class="nav-item"><a class="nav-link text-white" href="consultas.html">Consultas</a>
                </li>
                <li class="nav-item"><a class="nav-link text-white" href="resenas.html">Reseñas</a></li>
                <li class="nav-item"><a class="nav-link text-white" href="inventario.html">Inventario</a></li>
                <li class="nav-item"><a class="nav-link text-white" href="login.html">Iniciar Sesión</a>
                </li>
            </ul>
        </aside>

        <main class="flex-grow-1 p-4">
            <header class="text-center mb-4">
                <h1>Inventario de la Tienda</h1>
            </header>

            <section class="container">
                <form id="formInventario" novalidate>
                    <div class="mb-3">
                        <label for="producto" class="form-label">Producto</label>
                        <input type="text" class="form-control" id="producto" required>
                    </div>
                    <div class="mb-3">
                        <label for="cantidad" class="form-label">Cantidad</label>
                        <input type="number" class="form-control" id="cantidad" required min="1">
                    </div>
                    <button type="submit" class="btn-custom">Agregar al Inventario</button>
                </form>

                <section class="mt-4">
                    <h3>Stock disponible</h3>
                    <ul id="listaInventario" class="list-group"></ul>
                </section>

                <nav class="mt-3">
                    <a href="index.html" class="btn-secondary-custom">Volver al inicio</a>
                </nav>
            </section>
        </main>
    </div>


    <script src="./assets/js/inventario.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script src="./assets/js/app.js"></script>
</body>

</html>
