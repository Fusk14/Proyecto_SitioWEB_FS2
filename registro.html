<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - VetHome</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/styles.css">
</head>
<body>
<div class="container mt-5">
  <h2 class="text-center mb-4">Registro de Usuario - VetHome</h2>
  <div class="row justify-content-center">
    <div class="col-md-5">
      <form id="registroForm" novalidate>
        <div class="mb-3">
          <label for="nombre" class="form-label">Nombre completo</label>
          <input type="text" class="form-control" id="nombre" required>
          <div class="invalid-feedback">Debe ingresar un nombre válido.</div>
        </div>

        <div class="mb-3">
          <label for="rut" class="form-label">RUT</label>
          <input type="text" class="form-control" id="rut" placeholder="12345678-9" maxlength="10" required>
          <div class="invalid-feedback">Debe ingresar un RUT válido.</div>
        </div>

        <div class="mb-3">
          <label for="contrasena" class="form-label">Contraseña</label>
          <input type="password" class="form-control" id="contrasena" required>
          <div class="invalid-feedback">Debe ingresar una contraseña.</div>
        </div>

        <button type="submit" class="btn btn-success w-100">Registrar</button>
      </form>

      <div class="mt-3">
        <a href="login.html" class="btn btn-secondary w-100">Volver a Iniciar Sesión</a>
      </div>
    </div>
  </div>
</div>

<script>
  document.getElementById("registroForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const nombreInput = document.getElementById("nombre");
    const rutInput = document.getElementById("rut");
    const contrasenaInput = document.getElementById("contrasena");

    const nombre = nombreInput.value.trim();
    const rut = rutInput.value.trim();
    const contrasena = contrasenaInput.value.trim();

    let valido = true;

    // Validación nombre
    if (nombre === "") {
      nombreInput.classList.add("is-invalid");
      valido = false;
    } else {
      nombreInput.classList.remove("is-invalid");
      nombreInput.classList.add("is-valid");
    }

    // Validación RUT
    const rutRegex = /^[0-9]{7,8}-[0-9Kk]{1}$/;
    if (!rutRegex.test(rut)) {
      rutInput.classList.add("is-invalid");
      valido = false;
    } else {
      rutInput.classList.remove("is-invalid");
      rutInput.classList.add("is-valid");
    }

    // Validación contraseña
    if (contrasena === "") {
      contrasenaInput.classList.add("is-invalid");
      valido = false;
    } else {
      contrasenaInput.classList.remove("is-invalid");
      contrasenaInput.classList.add("is-valid");
    }

    if (!valido) return;

    // Recuperar usuarios guardados o crear array vacío
    const usuarios = JSON.parse(localStorage.getItem("usuarios")) || [];

    // Verificar si ya existe un usuario con el mismo RUT
    if (usuarios.find(u => u.rut === rut)) {
      alert("⚠️ Este RUT ya está registrado. Intenta iniciar sesión.");
      return;
    }

    // Agregar nuevo usuario
    usuarios.push({ nombre, rut, contrasena });
    localStorage.setItem("usuarios", JSON.stringify(usuarios));

    alert("✅ Registro exitoso. Ahora puedes iniciar sesión.");
    window.location.href = "login.html";
  });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
